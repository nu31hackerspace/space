version: '3.8'

services:
    app:
        image: ghcr.io/${IMAGE_NAME}:${GIT_COMMIT_HASH}
        dns:
            - 8.8.8.8
            - 8.8.4.4
        environment:
            - NUXT_PUBLIC_GIT_COMMIT_SHA=${GIT_COMMIT_HASH}
            - NUXT_PUBLIC_BASE_URL=https://nu31.space
            - NUXT_POSTGRES_URL=${POSTGRES_URL}
        deploy:
            update_config:
                order: start-first
        networks:
            - infra_reverse-proxy
            - infra_postgres-net
        healthcheck:
            test:
                [
                    'CMD',
                    'curl',
                    '-f',
                    'http://localhost:3000/api/service/health',
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s

networks:
    infra_reverse-proxy:
        external: true
    infra_postgres-net:
        external: true
